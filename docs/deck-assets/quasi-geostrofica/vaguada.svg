<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220">
  <rect width="440" height="220" fill="#EFE6D6"/>
  <text x="16" y="22" fill="#2C241C" font-family="Georgia, serif" font-size="13">corte oeste–este · HN</text>
  <!-- ejes -->
  <line x1="40" y1="28" x2="40" y2="168" stroke="#2C241C" stroke-width="1"/>
  <line x1="40" y1="168" x2="420" y2="168" stroke="#2C241C" stroke-width="1"/>
  <text x="28" y="40" fill="#2C241C" font-family="Georgia, serif" font-size="12">z</text>
  <text x="400" y="186" fill="#2C241C" font-family="Georgia, serif" font-size="12">x</text>
  <text x="48" y="186" fill="#7A2E3A" font-family="Georgia, serif" font-size="12">oeste</text>
  <text x="360" y="186" fill="#7A2E3A" font-family="Georgia, serif" font-size="12">este</text>
  <!-- tropopausa suave -->
  <path d="M48,52 C120,52 150,78 200,86 C260,94 300,52 412,48" fill="none" stroke="#D9CDB8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="300" y="42" fill="#2C241C" font-family="Georgia, serif" font-size="11">~ tropopausa</text>
  <!-- geopotencial en altura: vaguada -->
  <path d="M48,70 C110,70 150,118 200,122 C250,126 310,72 412,68" fill="none" stroke="#7A2E3A" stroke-width="2.2"/>
  <text x="168" y="114" fill="#7A2E3A" font-family="Georgia, serif" font-size="12">vaguada</text>
  <!-- descenso oeste de la vaguada -->
  <line x1="130" y1="78" x2="130" y2="150" stroke="#2C241C" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="78" y="118" fill="#2C241C" font-family="Georgia, serif" font-size="12">w &lt; 0</text>
  <!-- ascenso este -->
  <line x1="292" y1="150" x2="292" y2="78" stroke="#7A2E3A" stroke-width="1.8" marker-end="url(#arrB)"/>
  <text x="300" y="118" fill="#7A2E3A" font-family="Georgia, serif" font-size="12">w &gt; 0</text>
  <!-- bajo en superficie, al este del eje en altura -->
  <circle cx="268" cy="160" r="9" fill="none" stroke="#7A2E3A" stroke-width="1.6"/>
  <text x="262" y="164" fill="#7A2E3A" font-family="Georgia, serif" font-size="11">L</text>
  <text x="150" y="208" fill="#2C241C" font-family="Georgia, serif" font-size="12">eje inclinado al oeste · ascenso delante</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C241C"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A2E3A"/>
    </marker>
  </defs>
</svg>
